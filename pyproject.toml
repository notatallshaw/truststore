[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "truststore"
authors = [
  {name = "Seth Michael Larson", email = "sethmichaellarson@gmail.com"},
  {name = "David Glick", email = "david@glicksoftware.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version", "description"]
requires-python = ">= 3.10"

[project.urls]
Source = "https://github.com/sethmlarson/truststore"
Documentation = "https://truststore.readthedocs.io"

[dependency-groups]
deploy = [
  "build",
  "flit_core>=3.11,<4",
]
dev = [
  "aiohttp",
  # Nab 0.0.19 cannot target different PyPy ABIs by platform.
  "cryptography<50.0.2; implementation_name == 'pypy'",
  "flaky",
  "httpx",
  "nox",
  "pyopenssl",
  "pytest==8.3.5",
  "pytest-asyncio",
  "pytest-httpserver",
  "requests",
  "trustme",
  "urllib3",
]

[tool.nab]
mode = "universal"
default-groups = ["dev"]
# Keep ordinary lock regeneration stable; weekly updates pass --upgrade.
decision-order = "stable"
# Give new releases seven days before automated CI adoption.
uploaded-prior-to = "P7D"

[tool.nab.matrix]
python = ">=3.10,<3.16"
platforms = [
  "linux_x86_64",
  {id = "macos_arm64", runs-on-macos = "14.0"},
  "windows_amd64",
]
implementations = ["cpython", "pypy"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  # See: aio-libs/aiohttp#7545
  "ignore:.*datetime.utcfromtimestamp().*:DeprecationWarning",
]
markers = [
  "internet: test requires Internet access"
]

[tool.flit.sdist]
include = ["docs", "tests"]

[tool.ruff.lint]
extend-select = [
    "YTT",
    "I",
    "UP",
]

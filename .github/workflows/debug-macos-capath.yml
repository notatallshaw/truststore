name: Debug capath

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capath:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            python: "pypy3.11-v8.0.0"
          - os: windows-latest
            name: Windows
            python: "3.11"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }} Python ${{ matrix.python }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run capath diagnostic
        shell: bash
        run: |
          python -m pip install --upgrade --only-binary :all: 'pip>=26.2.1'
          python -m pip install -r dev-requirements.txt
          python -m pip install --no-deps -e .
          failures=0
          for attempt in {1..10}; do
            echo "test_api.py diagnostic attempt=$attempt"
            python -m pytest -q -s --max-runs=1 tests/test_api.py || failures=$((failures + 1))
          done
          echo "test_api.py diagnostic failures=$failures"
          test "$failures" -eq 0
